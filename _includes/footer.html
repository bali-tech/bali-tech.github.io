<footer class="site-footer">
  <div class="container">
    <div class="footer-columns">
      <div class="footer-col">
        <p>{{ site.description }}</p>
      </div>
      <div class="footer-col">
        <h3>Connect</h3>
        <ul class="social-links">
          <li><a href="https://www.linkedin.com/in/baliram-kale" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin"></i></a></li>
          <li><a href="https://www.instagram.com/houseofthemigraines" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3>Contact</h3>
        <ul class="contact-links">
          <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
          <li><a href="tel:{{ site.contact_number }}">{{ site.contact_number }}</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
      <p class="disclaimer">Views expressed are personal opinions and not intended to promote hatred or violence.</p>
    </div>
  </div>
</footer>
