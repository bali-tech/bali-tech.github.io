# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Your Blog Name
email: your-email@yourdomain.in
description: >- # this means to ignore newlines until "baseurl:"
  A blog about political commentary, Indian history, governance analysis,
  and youth awareness.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://yourdomain.in" # the base hostname & protocol for your site, e.g. http://example.com
author: Your Name
twitter_username: your_twitter_handle
github_username:  your_github_handle

# Social Links
social:
  - name: Twitter
    url: https://twitter.com/your_twitter_handle
  - name: GitHub
    url: https://github.com/your_github_handle
  - name: LinkedIn
    url: https://www.linkedin.com/in/your_linkedin_profile

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Collections
collections:
  posts:
    output: true

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Your Name"
  - scope:
      path: ""
    values:
      layout: "default"

# Reading Time
reading_time:
  strip_html: true
  words_per_minute: 200

# Site Navigation
navigation:
  - title: Home
    url: /
  - title: Blog
    url: /blog/
  - title: About
    url: /about/
  - title: Contact
    url: /contact/

# Categories
categories:
  - Politics
  - History
  - Governance
  - Youth & Society
  - Opinion / Editorial
